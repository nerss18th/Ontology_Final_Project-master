<aside class="sidebar sidebar-width bg-white border-end">
  <div class="p-4 p-xl-4">
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="project-icon rounded-3 d-flex align-items-center justify-content-center">
        <span class="material-symbols-outlined text-primary">architecture</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <h1 class="h6 fw-bold mb-0 text-truncate">{{ projectName }}</h1>
        <button
          class="btn btn-sm btn-light border-0 p-0 d-inline-flex align-items-center justify-content-center rounded-circle flex-shrink-0"
          style="width: 26px; height: 26px;" type="button" (click)="onOpenEditProject()"
          title="Edit Project Details">
          <span class="material-symbols-outlined text-secondary" style="font-size: 16px;">settings</span>
        </button>
      </div>
    </div>

    <nav class="nav flex-column gap-1" aria-label="Project sections">
      <button class="nav-link d-flex align-items-center gap-3 text-start border-0 w-100"
        [class.active]="activeSection === 'overview'"
        [disabled]="isEditMode && activeSection !== 'overview'"
        type="button" (click)="onSelectSection('overview')">
        <span class="material-symbols-outlined">grid_view</span>
        Overview
      </button>
      <button class="nav-link d-flex align-items-center gap-3 text-start border-0 w-100"
        [class.active]="activeSection === 'use-case'"
        [disabled]="isEditMode && activeSection !== 'use-case'"
        type="button" (click)="onSelectSection('use-case')">
        <span class="material-symbols-outlined">description</span>
        Use case Diagram
      </button>
      <button class="nav-link d-flex align-items-center gap-3 text-start border-0 w-100"
        [class.active]="activeSection === 'class'"
        [disabled]="isEditMode && activeSection !== 'class'"
        type="button" (click)="onSelectSection('class')">
        <span class="material-symbols-outlined">schema</span>
        Class Diagram
      </button>
      <button class="nav-link d-flex align-items-center gap-3 text-start border-0 w-100" type="button" disabled>
        <span class="material-symbols-outlined">settings_accessibility</span>
        Activity Diagram
      </button>
    </nav>
  </div>
</aside>
