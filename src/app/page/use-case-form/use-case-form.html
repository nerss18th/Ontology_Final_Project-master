<div class="form-shell min-vh-100 bg-body-tertiary">
  <header class="navbar bg-white border-bottom sticky-top px-3 px-md-4">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-3">
        <a class="brand d-flex align-items-center gap-2 text-decoration-none" routerLink="/dashboard/project/1">
          <span class="material-symbols-outlined text-primary">hub</span>
          <span class="fw-bold text-body">ONTOLOGY</span>
        </a>
        <div class="search-box position-relative d-none d-md-block">
          <span class="material-symbols-outlined position-absolute">search</span>
          <input class="form-control border-0" type="search" placeholder="Search diagrams..." aria-label="Search diagrams" />
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-light icon-button" type="button" aria-label="Notifications" title="Notifications">
          <span class="material-symbols-outlined">notifications</span>
        </button>
        <button class="btn btn-light icon-button" type="button" aria-label="Settings" title="Settings">
          <span class="material-symbols-outlined">settings</span>
        </button>
        <span class="avatar rounded-circle d-none d-sm-flex align-items-center justify-content-center ms-2">
          <span class="material-symbols-outlined">person</span>
        </span>
      </div>
    </div>
  </header>

  <div class="container-fluid px-0">
    <div class="row g-0">
      <aside class="col-lg-3 col-xl-2 sidebar bg-white border-end d-none d-lg-flex flex-column p-4">
        <div class="mb-4">
          <h1 class="h6 fw-semibold mb-1">Project Ontology</h1>
          <p class="small text-body-secondary mb-0">System Design Assets</p>
        </div>
        <nav class="nav flex-column gap-1" aria-label="Project sections">
          <a class="nav-link active d-flex align-items-center gap-3" routerLink="/dashboard/project/1/use-case/add">
            <span class="material-symbols-outlined">account_tree</span>Use Case
          </a>
          <a class="nav-link d-flex align-items-center gap-3" routerLink="/dashboard/project/1">
            <span class="material-symbols-outlined">category</span>Class
          </a>
          <a class="nav-link d-flex align-items-center gap-3" routerLink="/dashboard/project/1">
            <span class="material-symbols-outlined">schema</span>Activity
          </a>
          <a class="nav-link d-flex align-items-center gap-3" routerLink="/dashboard/project/1">
            <span class="material-symbols-outlined">reorder</span>Sequence
          </a>
        </nav>
      </aside>

      <main class="col-lg-9 col-xl-10 content-area">
        <div class="container-fluid form-content px-3 px-md-4 px-xl-5 py-4 py-lg-5">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4 mb-lg-5">
            <div>
              <a class="back-link d-flex align-items-center gap-2 text-primary text-decoration-none text-uppercase fw-bold mb-2" routerLink="/dashboard/project/1">
                <span class="material-symbols-outlined">arrow_back</span>
                Back to View
              </a>
              <h2 class="display-6 fw-bold mb-0">{{ isEditMode ? 'Edit Use Case' : 'Add Use Case' }}</h2>
            </div>
            <div class="d-flex gap-2 w-100 w-md-auto">
              <button class="btn btn-light flex-fill flex-md-grow-0 px-4 fw-semibold" type="button" (click)="cancel()">Cancel</button>
              <button class="btn btn-primary flex-fill flex-md-grow-0 px-4 fw-semibold d-inline-flex align-items-center justify-content-center gap-2" type="button" (click)="addUseCase()">
                <span class="material-symbols-outlined">add</span>Add
              </button>
            </div>
          </div>

          <section class="card border shadow-sm rounded-3 overflow-hidden">
            <div class="card-header bg-body-tertiary border-bottom px-3 px-md-4 py-3">
              <h3 class="h6 fw-semibold mb-0">Use Case Summary</h3>
            </div>
            <div class="card-body p-3 p-md-4">
              <div class="row g-4 mb-4">
                <div class="col-12 col-md-6">
                  <label class="form-label fw-semibold" for="useCaseId">Use Case ID</label>
                  <div class="input-group">
                    <input id="useCaseId" class="form-control bg-body-tertiary" type="text" [(ngModel)]="useCaseId" readonly />
                    <span class="input-group-text bg-body-tertiary"><span class="material-symbols-outlined">fingerprint</span></span>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label fw-semibold" for="useCaseType">Use Case Type</label>
                  <select id="useCaseType" class="form-select" [(ngModel)]="useCaseType">
                    <option value="business">Business Use Case</option>
                    <option value="system">System Use Case</option>
                    <option value="subfunction">Subfunction</option>
                  </select>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold" for="useCaseName">Use Case Name</label>
                <input id="useCaseName" class="form-control" type="text" placeholder="Enter a descriptive name" [(ngModel)]="useCaseName" />
              </div>
              <div>
                <label class="form-label fw-semibold" for="description">Use Case Description</label>
                <textarea id="description" class="form-control" rows="4" placeholder="Provide a detailed overview of the use case objectives..." [(ngModel)]="description"></textarea>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
</div>
