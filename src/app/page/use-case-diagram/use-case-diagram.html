<section class="card border-0 shadow-sm rounded-3">
  <div class="card-body p-3 p-md-4 p-xl-5">
    <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
      <div>
        <h2 class="h4 fw-bold mb-0">Use Case Diagram</h2>
      </div>
      <a class="btn btn-primary d-inline-flex align-items-center justify-content-center gap-2"
        [routerLink]="['/dashboard/project/1/edit']" [queryParams]="{ diagram: 'use-case' }">
        <span class="material-symbols-outlined">edit</span>
        Edit
      </a>
    </div>

    <div
      class="diagram-preview-container w-100 rounded-3 border p-3 p-md-4 text-center mb-4 overflow-hidden position-relative"
      [routerLink]="['/dashboard/project/1/edit']" [queryParams]="{ diagram: 'use-case' }" style="cursor: pointer;"
      title="Click to Edit Diagram">
      <img [src]="useCaseDiagramImage" alt="Use Case Diagram"
        class="diagram-img img-fluid rounded-3 shadow-sm mx-auto d-block" />
    </div>

    <div class="d-flex align-items-center justify-content-between gap-3 mb-2">
      <div class="d-flex align-items-center gap-3">
        <h3 class="h5 fw-bold mb-0">Use Case Summary</h3>
        <span class="badge text-bg-light border">{{ useCases.length }} Use Cases</span>
      </div>
      <button class="btn btn-outline-primary btn-sm d-inline-flex align-items-center gap-2" type="button"
        (click)="openAddModal()">
        <span class="material-symbols-outlined">add</span>
        Add Use Case
      </button>
    </div>

    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Type(Actor/Use Case)</th>
            <th scope="col">Caption</th>
            <th scope="col">Description</th>
            <th scope="col" class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let useCase of useCases">
            <th scope="row">{{ useCase.id }}</th>
            <td>{{ useCase.type }}</td>
            <td>{{ useCase.caption }}</td>
            <td>{{ useCase.description }}</td>
            <td>
              <div class="d-flex justify-content-end gap-1">
                <button class="btn btn-sm btn-light icon-button delete-button" type="button"
                  [attr.aria-label]="'Delete ' + useCase.caption" title="Delete" (click)="deleteUseCase(useCase.id)">
                  <span class="material-symbols-outlined">delete</span>
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="useCases.length === 0">
            <td class="text-center text-body-secondary py-4" colspan="5">No use cases yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Add Use Case Pop-up -->
<div *ngIf="isAddModalOpen" class="modal-backdrop fade show" (click)="closeAddModal()"></div>
<div *ngIf="isAddModalOpen" class="modal d-block" tabindex="-1" role="dialog" aria-labelledby="addUseCaseModalTitle">
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 shadow rounded-4 overflow-hidden">
      <div class="modal-header bg-body-tertiary px-4 py-3 border-bottom">
        <h5 class="modal-title fw-bold d-flex align-items-center gap-2 mb-0" id="addUseCaseModalTitle">
          <span class="material-symbols-outlined text-primary">add_circle</span>
          Add New Use Case
        </h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="closeAddModal()"></button>
      </div>
      <form (ngSubmit)="saveUseCase()">
        <div class="modal-body p-4">
          <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6">
              <label for="useCaseIdInput" class="form-label fw-semibold small">ID</label>
              <input id="useCaseIdInput" type="text" class="form-control bg-body-tertiary" [(ngModel)]="newUseCase.id"
                name="useCaseId" readonly />
            </div>
            <div class="col-12 col-sm-6">
              <label for="useCaseTypeSelect" class="form-label fw-semibold small">Type(Actor/Use Case)</label>
              <select id="useCaseTypeSelect" class="form-select" [(ngModel)]="newUseCase.type" name="useCaseType">
                <option value="Use Case">Use Case</option>
                <option value="Actor">Actor</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label for="useCaseCaptionInput" class="form-label fw-semibold small">Caption <span
                class="text-danger">*</span></label>
            <input id="useCaseCaptionInput" type="text" class="form-control" placeholder=""
              [(ngModel)]="newUseCase.caption" name="useCaseCaption" required />
          </div>
          <div class="mb-2">
            <label for="useCaseDescInput" class="form-label fw-semibold small">Description</label>
            <textarea id="useCaseDescInput" class="form-control" rows="3" placeholder=""
              [(ngModel)]="newUseCase.description" name="useCaseDescription"></textarea>
          </div>
        </div>
        <div class="modal-footer bg-body-tertiary px-4 py-3 border-top gap-2">
          <button type="button" class="btn btn-outline-secondary px-4 fw-semibold rounded-3"
            (click)="closeAddModal()">Cancel</button>
          <button type="submit"
            class="btn btn-primary px-4 fw-semibold rounded-3 d-inline-flex align-items-center gap-2"
            [disabled]="!newUseCase.caption.trim()">
            <span class="material-symbols-outlined fs-6">check</span>Save
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
