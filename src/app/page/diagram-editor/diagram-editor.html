<div class="editor-shell d-flex flex-column flex-lg-row min-vh-100 bg-body-tertiary pt-5 mt-2">
  <aside class="sidebar sidebar-width bg-white border-end">
    <div class="p-4 p-xl-4">
      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="project-icon rounded-3 d-flex align-items-center justify-content-center">
          <span class="material-symbols-outlined text-primary">architecture</span>
        </div>
        <div>
          <h1 class="h6 fw-bold mb-1">Project 1</h1>
        </div>
      </div>

      <nav class="nav flex-column gap-1" aria-label="Project sections">
        <a class="nav-link active d-flex align-items-center gap-3 text-start text-decoration-none" routerLink="/dashboard/project/1">
          <span class="material-symbols-outlined">description</span>
          Use case Diagram
        </a>
        <button class="nav-link d-flex align-items-center gap-3 text-start" type="button" disabled>
          <span class="material-symbols-outlined">schema</span>
          Class Diagram
        </button>
        <button class="nav-link d-flex align-items-center gap-3 text-start" type="button" disabled>
          <span class="material-symbols-outlined">settings_accessibility</span>
          Activity Diagram
        </button>
      </nav>
    </div>
  </aside>

  <main class="flex-grow-1 content-area min-w-0">
    <div class="container-fluid content-container py-3 py-lg-4 px-3 px-md-4 px-xl-5">
      <nav class="breadcrumb small mb-3" aria-label="breadcrumb">
          <li class="breadcrumb-item"><a routerLink="/dashboard" class="text-decoration-none">ONTOLOGY</a></li>
          <li class="breadcrumb-item active" aria-current="page">Project 1</li>
        </nav>

        <section class="card border-0 shadow-sm rounded-3">
          <div class="card-body p-3 p-md-4 p-xl-5">
            <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
              <div>
                <p class="text-primary text-uppercase small fw-bold mb-1">Project 1</p>
                <h2 class="h4 fw-bold mb-0">Edit Use Case Diagram</h2>
              </div>
              <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary px-4 fw-semibold" type="button" (click)="cancel()">Cancel</button>
                <button class="btn btn-primary px-4 fw-semibold d-inline-flex align-items-center gap-2" type="button" (click)="saveChanges()">
                  <span class="material-symbols-outlined fs-6">save</span>Save Changes
                </button>
              </div>
            </div>

            <div class="upload-panel bg-body-tertiary rounded-3 p-3 p-md-5 text-center border">
              <div class="diagram-preview rounded-3 d-flex align-items-center justify-content-center mx-auto mb-4">
                <img *ngIf="previewUrl; else emptyPreview" [src]="previewUrl" [alt]="fileName" />
                <ng-template #emptyPreview>
                  <div class="preview-placeholder d-flex flex-column align-items-center justify-content-center gap-3">
                    <span class="material-symbols-outlined">schema</span>
                    <span>Diagram Preview</span>
                  </div>
                </ng-template>
              </div>
              <p class="fw-semibold mb-1">Preview: {{ fileName }}</p>
              <p class="small text-body-secondary mb-4">Last modified: {{ lastModified }}</p>
              <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                <button class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center gap-2" type="button" (click)="openFilePicker()">
                  <span class="material-symbols-outlined">upload</span>Replace Image
                </button>
                <button class="btn btn-light d-inline-flex align-items-center justify-content-center gap-2" type="button" (click)="openFullScreen()">
                  <span class="material-symbols-outlined">visibility</span>Full Screen
                </button>
              </div>
              <input #fileInput class="d-none" type="file" accept="image/*" (change)="onFileSelected($event)" />
            </div>

          </div>
        </section>
      </div>
    </main>
  </div>
